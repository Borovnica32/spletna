<!DOCTYPE html>
<html>
<head>
    <title>403 Forbidden</title>
    <style>
        body{
            background-color: #000;
            color: #0f0;
            font-family: "Press Start 2P", monospace;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .text{
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1{
            text-shadow: 0 0 10px #0f0;
            font-size: 70px;
        }
        #num{
            font-size: 60px;
        }
        .cursor{
            display: inline-block;
            animation: blink 1s step-end infinite;
        }
        @keyframes blink{
            50%{
                opacity: 0;
            }
        }
    </style>
    <link href="https://fonts.googleapis.com/css?family=Press+Start+2P" rel="stylesheet">
</head>
<body>
    <div class="text">
        <h1 id="num">403 Error</h1>
        <h1>Forbidden<div class="cursor">_</div></h1>
    </div>
</body>
</html>
